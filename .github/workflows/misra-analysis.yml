name: C++ Safety Analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy

      - name: Configure project
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build project
        run: cmake --build build

      - name: Run static analysis
        id: analysis
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports

          run-clang-tidy \
            -p build \
            -header-filter='^(Application|Common|Services|slld)/.*' \
            2>&1 | tee reports/static-analysis.txt

      - name: Write report summary
        if: always()
        shell: bash
        run: |
          echo "## C++ static-analysis report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ steps.analysis.outcome }}" == "success" ]]; then
            echo "✅ No selected safety-rule violations detected." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Static-analysis violations were detected." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the **cpp-safety-report** artifact for details." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-safety-report
          path: reports/static-analysis.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce quality gate
        if: steps.analysis.outcome == 'failure'
        run: |
          echo "::error::C++ safety-rule violations were detected. See the job summary and report artifact."
          exit 1